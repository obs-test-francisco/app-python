# # Observe data token (ex: a1b2c3d4e5f6g7h8i9k0:l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6)
# token: "${TOKEN}"

# # Target Observe collection url (ex: https://123456789012.collect.observeinc.com/)
# observe_url: "${OBSERVE_URL}"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

exporters:
  otlphttp/observelogs:
    endpoint: "${OBSERVE_URL}"
    headers:
      authorization: "Bearer ${TOKEN}"
      x-observe-target-package: "Host Explorer"
    sending_queue:
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true
    compression: zstd
  otlphttp/observemetrics:
    endpoint: "${OBSERVE_URL}"
    headers:
      authorization: "Bearer ${TOKEN}"
      x-observe-target-package: "Metrics"
    sending_queue:
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true
    compression: zstd
  otlphttp/observetracing:
    endpoint: "${OBSERVE_URL}"
    headers:
      authorization: "Bearer ${TOKEN}"
      x-observe-target-package: "Tracing"
    sending_queue:
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true
    compression: zstd

forwarding:
    enabled: true
    metrics:
        output_format: otel
        
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: 
        - otlphttp/observelogs
    traces:
      receivers: [otlp]
      exporters: 
        - otlphttp/observetracing
    metrics:
      receivers: [otlp]
      exporters: 
        - otlphttp/observemetrics
  telemetry:
    metrics:
      address: localhost:8888
