# # Observe data token (ex: a1b2c3d4e5f6g7h8i9k0:l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6)
token: "${TOKEN}"

# # Target Observe collection url (ex: https://123456789012.collect.observeinc.com/)
observe_url: "${OBSERVE_URL}"

host_monitoring:
  enabled: false
  logs:
    enabled: false

forwarding:
  enabled: true
  metrics:
    output_format: otel

resource_attributes:
  service.name: ${OTEL_SERVICE_NAME}
  service.version: ${OTEL_SERVICE_VERSION}
  deployment.environment.name: ${OTEL_SERVICE_ENVIRONMENT}

otel_config_overrides:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Comment out locally
    awsecscontainermetrics:
      collection_interval: 20s
    
    filelog:
      include: [ /mnt/shared/logs/*.json ]
      operators:
        - type: json_parser
          timestamp:
            parse_from: attributes.asctime
            layout: '%Y-%m-%d %H:%M:%S,%f'

  processors:
    batch:
    resource:
      attributes:
        - key: service.name
          value: ${OTEL_SERVICE_NAME}
          action: insert
        - key: deployment.environment.name
          value: ${OTEL_SERVICE_ENVIRONMENT}
          action: insert
        - key: service.version
          value: ${OTEL_SERVICE_VERSION}
          action: insert

  exporters:
    otlphttp/observelogs:
      endpoint: "${OBSERVE_URL}/v2/otel"
      headers:
        authorization: "Bearer ${TOKEN}"
        x-observe-target-package: "Host Explorer"
      sending_queue:
        num_consumers: 4
        queue_size: 100
      retry_on_failure:
        enabled: true
      compression: zstd

  service:
    pipelines:
      logs:
        receivers: 
          - filelog
        processors: 
          - batch
          - resource
        exporters: 
          - otlphttp/observelogs
      
      # Comment out locally
      metrics/ecs_fargate:
        receivers: 
          - awsecscontainermetrics
        processors: 
          - batch
          - memory_limiter
          - resourcedetection
          - resourcedetection/cloud
        exporters: 
          - otlphttp/observemetrics  
  