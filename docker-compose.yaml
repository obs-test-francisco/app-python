services:
  app:
    image: obsfrancisco/otel-python-app:${APP_VERSION:-latest}
    build:
      context: ./app
      platforms:
        - linux/amd64
        - linux/arm64
      target: dev
    env_file: ./tools/docker/env-files/otel-python-app.env
    volumes:
      - ./app/src:/opt/site/code
      - shared-logs:/mnt/shared/logs:rw
    depends_on:
      - db-mysql
      - db-redis
      - init
    networks:
      - backend
    ports:
      - "8000:8000"
      - "5678:5678"

  init:
    image: alpine:latest
    command:
      - "sh"
      - "-c"
      - "set -euo pipefail; mkdir -p /mnt/shared-logs/logs; chmod -R 0777 /mnt/shared-logs; echo \"Init Completed\"; exit 0"
    volumes:
      - shared-logs:/mnt/shared-logs:rw

  db-redis:
    image: "redis:6.2-alpine"
    networks:
      - backend
    ports:
      - "6379:6379"

  db-mysql:
    image: mysql:8.0.44
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file: ./tools/docker/env-files/mysql.env
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - backend
    ports:
      - "3306:3306"

  observe-agent:
    image: observeinc/observe-agent:2.9.1
    env_file: ./tools/docker/env-files/observe-agent.env
    networks:
      - backend
    ports: 
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ./tools/observe-agent/observe-agent.compose.yaml:/etc/observe-agent/observe-agent.yaml
      - shared-logs:/mnt/shared/logs
    depends_on:
      - app
      - init

networks:
  backend:

volumes:
  shared-logs:
  shared-config: