apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: otel-python-app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/secrets: 'OBSERVE:projects/francisco-476421/secrets/observe-config'
    spec:
      serviceAccountName: otel-python-app-runtime@francisco-476421.iam.gserviceaccount.com
      containers:
        # -------- App (ingress container) --------
        - name: app
          image: us-west1-docker.pkg.dev/francisco-476421/otel-python-app/otel-python-app:v0.50.6
          ports:
            - containerPort: 8000
          env:
            - name: APP_EXPIRE_LOCK
              value: "true"
            - name: FLASK_APP
              value: "app"
            - name: FLASK_PORT
              value: "8000"
            - name: LOGS_DIR
              value: "/mnt/shared/logs"

            # Internal DB endpoints (localhost because they are sidecars)
            - name: MYSQL_HOST
              value: "127.0.0.1"
            - name: MYSQL_USER
              value: "hackweek"
            - name: MYSQL_PASSWORD
              value: "password"
            - name: MYSQL_DATABASE
              value: "hackweek"

            - name: REDIS_URL
              value: "redis://localhost:6379/0"

            # Internal observe-agent OTLP endpoints (localhost because sidecar)
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://localhost:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=otel-python-app,service.version=v0.50.6,deployment.environment.name=gcr-dev"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,host,os,serviceinstance"
            - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: "DELTA"
          volumeMounts:
            - name: shared-logs
              mountPath: /mnt/shared/logs

        # -------- Redis sidecar --------
        - name: db-redis
          image: redis:6.2-alpine


        # -------- MySQL sidecar --------
        - name: db-mysql
          image: mysql:8.0.44
          args:
            - "--default-authentication-plugin=mysql_native_password"
            - "--character-set-server=utf8mb4"
            - "--collation-server=utf8mb4_unicode_ci"
          env:
            # These mirror typical mysql.env usage (adjust to match your file)
            - name: MYSQL_DATABASE
              value: "hackweek"
            - name: MYSQL_USER
              value: "hackweek"
            - name: MYSQL_PASSWORD
              value: "password"
            # Required by the official mysql image unless you use allow-empty-password (not recommended)
            - name: MYSQL_ROOT_PASSWORD
              value: "password"
          volumeMounts:
            - name: shared-data
              mountPath: /var/lib/mysql

        # -------- Observe Agent sidecar --------
        - name: observe-agent
          image: observeinc/observe-agent:2.9.1
          args:
            - --observe-config
            - /mnt/observe-agent/observe-agent.yaml
            - start
          # Mount the config file into the container
          volumeMounts:
            - name: shared-config
              mountPath: /mnt/observe-agent/

            - name: shared-logs
              mountPath: /mnt/shared/logs
   
      volumes:
        # shared-logs from docker-compose => emptyDir for dev/demo
        - name: shared-logs
          emptyDir: {}

        # mysql volume from docker-compose => emptyDir (ephemeral). For persistence use a PVC instead.
        - name: shared-data
          emptyDir: {}

        # mount the config object 
        - name: shared-config
          secret:
            secretName: 'OBSERVE'          
            items:
              - key: "4"
                path: observe-agent.yaml
