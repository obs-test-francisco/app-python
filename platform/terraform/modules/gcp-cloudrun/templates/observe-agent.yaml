# # Observe data token (ex: a1b2c3d4e5f6g7h8i9k0:l1m2n3o4p5q6r7s8t9u0v1w2x3y4z5a6)
token: "ds1Ls2TyVZklsOtlTBZZ:fInxUyHs5BLgyVjNHKVhxq0ZFoD5Ab2N"

# # Target Observe collection url (ex: https://123456789012.collect.observeinc.com/)
observe_url: "https://169096891327.collect.observeinc.com/"
            
host_monitoring:
  enabled: false
  logs:
    enabled: false

forwarding:
  enabled: true
  metrics:
    output_format: otel

otel_config_overrides:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    filelog:
      include: [ /mnt/shared/logs/*.json ]
      operators:
        - type: json_parser
          timestamp:
            parse_from: attributes.asctime
            layout: '%Y-%m-%d %H:%M:%S,%f'

  processors:
    batch:
    resource:
      attributes:
        - key: service.name
          value: otel-python-app
          action: insert
        - key: deployment.environment.name
          value: gcr-dev
          action: insert
        - key: service.version
          value: v0.47.0
          action: insert
    resourcedetection/gcp:
      detectors: [env, gcp]
      timeout: 2s
      override: false

  service:
    pipelines:
      logs/gcp:
        receivers: [filelog]
        processors: [batch,resource]
        exporters: [otlphttp/observe]

      traces/gcp:
        receivers: [otlp]
        processors: [memory_limiter, resourcedetection, resourcedetection/gcp, batch]
        exporters: [otlphttp/observe]      

      metrics/gcp:
        receivers: [otlp]
        processors: [memory_limiter, resourcedetection, resourcedetection/gcp, batch]
        exporters: [otlphttp/observemetrics]      
